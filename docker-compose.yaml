services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-server
    #ports:
    #  - "${PORT:-8000}:8080"
    expose:
      - "8080"
    volumes:
      - ./models:/models
    # Мы объединяем проверку, скачивание и запуск в одну команду
    entrypoint: >
      sh -c "
      MODEL_PATH=\"/models/$$MODEL_NAME\";
      if [ ! -f \"$$MODEL_PATH\" ] || [ $$(stat -c%s \"$$MODEL_PATH\") -lt 1000000 ]; then
        echo 'Модель не найдена или битая. Начинаю загрузку...';
        apt-get update && apt-get install -y curl;
        curl -L $$DONLOAD_URL -o \"$$MODEL_PATH\";
        echo 'Загрузка завершена!';
      else
        echo 'Модель найдена, запускаю сервер...';
      fi;
      exec /app/llama-server -m \"$$MODEL_PATH\" --host 0.0.0.0 --port 8080 -t 24 -c 32768 -fa on --mlock -np 4

      "
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "${PORT:-8000}:80"
    environment:
      - ALLOWED_IP=${ALLOWED_IP:-127.0.0.1}
      - LLAMA_HOST=llama-server
      - LLAMA_PORT=8080
      - WHITE_LIST=${WHITE_LIST}
    entrypoint: >
     sh -c "
      # Превращаем список из WHITE_LIST (через запятую или пробел) в формат allow IP;
      EXTRA_ALLOWS=$(echo $WHITE_LIST | sed 's/[, ]/ /g' | xargs -n1 | sed 's/^/allow /;s/$/;/')

      echo \"server {
        listen 80;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        
        set_real_ip_from  0.0.0.0/0;
        real_ip_header    X-Forwarded-For;

        allow ${ALLOWED_IP};
        $EXTRA_ALLOWS
        deny all;

        location / {
          proxy_pass http://llama-server:8080;
          proxy_set_header Host \$host;
          proxy_set_header X-Real-IP \$remote_addr;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_read_timeout 300s;
        }
      }\" > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - llama-server
    restart: unless-stopped