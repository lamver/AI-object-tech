services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-server
    #ports:
    #  - "${PORT:-8000}:8080"
    expose:
      - "8080"
    volumes:
      - ./models:/models
    # Мы объединяем проверку, скачивание и запуск в одну команду
    entrypoint: >
      sh -c "
      MODEL_PATH=\"/models/$$MODEL_NAME\";
      if [ ! -f \"$$MODEL_PATH\" ] || [ $$(stat -c%s \"$$MODEL_PATH\") -lt 1000000 ]; then
        echo 'Модель не найдена или битая. Начинаю загрузку...';
        apt-get update && apt-get install -y curl;
        curl -L $$DONLOAD_URL -o \"$$MODEL_PATH\";
        echo 'Загрузка завершена!';
      else
        echo 'Модель найдена, запускаю сервер...';
      fi;
      exec /app/llama-server -m \"$$MODEL_PATH\" --host 0.0.0.0 --port 8080 -t 12 -c 32768 -fa on --mlock -np 4

      "
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "${PORT:-8000}:80"
    environment:
      - ALLOWED_IP=${ALLOWED_IP}
      - LLAMA_HOST=llama-server
      - LLAMA_PORT=8080
    command: >
      sh -c "rm -f /etc/nginx/conf.d/default.conf && 
             /docker-entrypoint.sh nginx -g 'daemon off;'"
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - llama-server
    restart: unless-stopped