services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-server
    #ports:
    #  - "${PORT:-8000}:8080"
    expose:
      - "8080"
    volumes:
      - ./models:/models
    # Мы объединяем проверку, скачивание и запуск в одну команду
    entrypoint: >
      sh -c "
      MODEL_PATH=\"/models/$$MODEL_NAME\";
      if [ ! -f \"$$MODEL_PATH\" ] || [ $$(stat -c%s \"$$MODEL_PATH\") -lt 1000000 ]; then
        echo 'Модель не найдена или битая. Начинаю загрузку...';
        apt-get update && apt-get install -y curl;
        curl -L $$DONLOAD_URL -o \"$$MODEL_PATH\";
        echo 'Загрузка завершена!';
      else
        echo 'Модель найдена, запускаю сервер...';
      fi;
      exec /app/llama-server -m \"$$MODEL_PATH\"  --mmproj \"/models/mmproj-F16.gguf\" --embeddings  --host 0.0.0.0 --port 8080 -t 24 -c 131072 -b 16384 -fa on --mlock -np 2 --reasoning off

      "
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "${PORT:-8000}:80"
    environment:
      - ALLOWED_IP=${ALLOWED_IP:-127.0.0.1}
      - ALLOWED_IP_2=${ALLOWED_IP_2:-127.0.0.1}
      - LLAMA_HOST=llama-server
      - LLAMA_PORT=8080
      - WHITE_LIST=${WHITE_LIST}
    entrypoint: >
      sh -c "echo 'server {
        listen 80;
        # Разрешаем внутреннюю сеть Docker (обязательно)
        allow 192.168.64.0/24;
        allow 172.16.0.0/12;
        # Доверяем заголовкам провайдера, чтобы увидеть твой реальный IP
        set_real_ip_from  0.0.0.0/0;
        real_ip_header    X-Forwarded-For;

        allow ${ALLOWED_IP};
        allow ${ALLOWED_IP_2};
        deny all;

        location / {
          proxy_pass http://llama-server:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_read_timeout 300s;
        }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - llama-server
    restart: unless-stopped