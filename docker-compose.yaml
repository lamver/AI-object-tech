services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-server
    ports:
      - "127.0.0.1:8889:8080"
    expose:
      - "8080"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./models:/models
    # Мы объединяем проверку, скачивание и запуск в одну команду
    entrypoint: >
      sh -c "
      MODEL_PATH=\"/models/$$MODEL_NAME\";
      if [ ! -f \"$$MODEL_PATH\" ] || [ $$(stat -c%s \"$$MODEL_PATH\") -lt 1000000 ]; then
        echo 'Модель не найдена или битая. Начинаю загрузку...';
        apt-get update && apt-get install -y curl;
        curl -L $$DONLOAD_URL -o \"$$MODEL_PATH\";
        echo 'Загрузка завершена!';
      else
        echo 'Модель найдена, запускаю сервер...';
      fi;
      exec /app/llama-server -m \"$$MODEL_PATH\"  --mmproj \"/models/mmproj-F16.gguf\" --embeddings  --host 0.0.0.0 --port 8080 -t 24 -c 131072 -b 16384 -fa on --mlock --context-shift -np 4 --cache-prompt --cache-ram 2048 --lookup-cache-dynamic /models/lookup_cache.bin --reasoning off

      "
    restart: unless-stopped
