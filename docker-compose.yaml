services:
  model-downloader:
      image: alpine:latest
      container_name: model-downloader
      volumes:
        - ./models:/models
      command: >
        sh -c "
        MODEL_NAME='gemma-4-E4B-it-GGUF:UD-Q6_K_XL';
        MODEL_PATH=\"/models/$$MODEL_NAME\";
        if [ ! -f \"$$MODEL_PATH\" ]; then
          echo 'Модель не найдена. Начинаю скачивание...';
          apk add --no-cache curl;
          # Прямая ссылка на скачивание конкретного файла
          curl -L https://huggingface.co/unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q6_K.gguf?download=true -o \"$$MODEL_PATH\";
          echo 'Загрузка завершена!';
        else
          echo 'Модель уже загружена. Пропускаю скачивание.';
        fi
        "
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server  # Official image
    container_name: llama-server
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8000}:8080"
    volumes:
      - ./models:/models  # Mount your local models directory
    command: >
      -m /models/gemma-4-E4B-it-GGUF:UD-Q6_K_XL
      --host 0.0.0.0
      --port 8080
      -c 2048
    restart: unless-stopped