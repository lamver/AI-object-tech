events {}

http {
    server {
        listen 80;

        # Разрешенные IP (замените на свои)
        allow 192.168.1.100; 
        allow 95.160.0.0/24; # Можно разрешать подсети
        
        # Запретить всем остальным
        deny all;

        location / {
            proxy_pass http://gemma-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}